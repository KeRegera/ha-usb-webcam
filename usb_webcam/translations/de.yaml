configuration:
  device:
    name: Kamera
    description: "Deine Webcam aus der Liste wählen: den Eintrag /dev/v4l/by-id/usb-…-video-index0"
  resolution:
    name: Auflösung
    description: "Videoauflösung. Kann die Kamera sie nicht, wird die nächstkleinere genommen"
  fps:
    name: Bilder pro Sekunde
    description: "Framerate, z. B. 30"
  timestamp:
    name: Datum und Uhrzeit einblenden
    description: "Steht dann auch in Aufnahmen und Standbildern. Kostet auf dem Raspberry Pi Bilder pro Sekunde"
  timestamp_position:
    name: Position von Datum und Uhrzeit
    description: "top_left = oben links, top_right = oben rechts, bottom_left = unten links, bottom_right = unten rechts"
  camera_name:
    name: Kameraname
    description: "Name in Home Assistant, z. B. 'USB Webcam' -> camera.usb_webcam"

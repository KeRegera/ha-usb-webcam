configuration:
  device:
    name: Camera
    description: "Pick your webcam from the list: /dev/v4l/by-id/usb-…-video-index0"
  resolution:
    name: Resolution
    description: "If the camera does not support it, the next smaller one is used"
  fps:
    name: Frames per second
    description: "Frame rate, e.g. 30"
  timestamp:
    name: Show date and time
    description: "Also part of recordings and snapshots. Costs frame rate on a Raspberry Pi"
  timestamp_position:
    name: Date/time position
    description: "top_left, top_right, bottom_left, bottom_right"
  camera_name:
    name: Camera name
    description: "Name in Home Assistant, e.g. 'USB Webcam' -> camera.usb_webcam"

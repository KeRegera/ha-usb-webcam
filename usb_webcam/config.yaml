# https://developers.home-assistant.io/docs/apps/configuration
name: USB Webcam
version: "2.0.0"
slug: usb_webcam
description: USB-Webcam (bis 4K) als Kamera in Home Assistant – wie MotionEye, mit Datum/Uhrzeit im Bild
url: "https://github.com/KeRegera/ha-usb-webcam/tree/main/usb_webcam"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto

# Zugriff auf die Webcam
video: true

# Für das automatische Anlegen der Kamera in Home Assistant
hassio_api: true
homeassistant_api: true

options:
  resolution: "3840x2160"
  fps: 30
  timestamp: true
  timestamp_position: top_left
  camera_name: USB Webcam

schema:
  device: device
  resolution: list(3840x2160|2560x1440|1920x1080|1280x720|640x480)
  fps: int(1,60)
  timestamp: bool
  timestamp_position: list(top_left|top_right|bottom_left|bottom_right)
  camera_name: str
